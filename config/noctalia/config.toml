[accessibility]
ui_scale = 1.20
[bar.default]
center = [ "media", "spacer_1", "clock" ]
concave_edge_corners = false
background_opacity = 0.0
end = [ "network", "brightness", "battery", "volume", "notifications", "tray", "spacer_1", "group:g1" ]
margin_edge = 0
margin_ends = 0
radius_bottom_left = 0
radius_bottom_right = 0
radius_top_left = 0
radius_top_right = 0
scale = 1.0
start = [ "launcher", "workspaces", "spacer_1", "active_window" ]
thickness = 30
    [[bar.default.capsule_group]]
    border = ""
    fill = "#00000000"
    id = "g1"
    members = [ "temp", "sysmon_2", "sysmon_3" ]
    opacity = 1.0
    padding = 4.0
    radius = 0
[shell]
clipboard_image_action_command = "satty -f -"
launch_apps_as_systemd_services = true
polkit_agent = true
settings_show_advanced = true
    [shell.greeter_sync]
    auto_sync = true
    [shell.panel]
    open_near_click_control_center = true
    session_placement = "floating"
    session_position = "center"
    [shell.screenshot]
    copy_to_clipboard = false
    pipe_command = "satty -f -"
    pipe_to_command = true
    save_to_file = false
    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"
    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"
    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "3"
    variant = "default"
    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "4"
    variant = "default"
    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

[system.monitor]
gpu_poll_seconds = 2
[theme]
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"
    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "kcolorscheme", "kitty", "qt", "alacritty" ]
[widget.active_window]
color = "primary"
title_scroll = "none"
max_length = 140
[widget.clock]
color = "primary"
format = "{:%a %b %d  %I:%M %p}"
[widget.launcher]
color = "secondary"
[widget.media]
hide_when_no_media = true
title_scroll = "on_hover"
[widget.network]
color = "secondary"
show_label = false
[widget.battery]
color = "secondary"
show_label = false
[widget.brightness]
color = "secondary"
show_label = false
[widget.notifications]
color = "secondary"
[widget.session]
color = "error"
[widget.spacer_1]
type = "spacer"
[widget.temp]
type = "sysmon"
stat = "cpu_temp"
visualization = "gauge"
show_value = false
show_glyph = true
[widget.sysmon_2]
type = "sysmon"
stat = "gpu_temp"
glyph = "gpu-usage"
visualization = "gauge"
show_value = false
show_glyph = true
[widget.sysmon_3]
type = "sysmon"
stat = "ram_used"
glyph = "cpu-2"
visualization = "gauge"
show_value = true
show_glyph = true
[widget.tray]
capsule = false
drawer = true
pinned = [ "NetworkManager", "pipewire", "kdeconnect" ]
hidden = [ ]
[widget.volume]
color = "secondary"
[widget.workspaces]
capsule = false
label_source = "id"
show_labels = true